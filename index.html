<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>💌</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="envelope" class="envelope">
      <div class="env-heart"></div>
      <div class="flap"></div>
    </div>

    <div id="letter" class="letter">
      <audio id="audio" src="careless-whisper.mp3" loop></audio>
      <p class="message">Will you be my Valentine? 💕</p>
      <img
        class="image"
        src="https://preview.redd.it/pov-someone-throws-a-blurry-rose-at-you-v0-1bddteemfz9f1.jpeg?auto=webp&s=f8460fee57837fd36b5e82572f5c357c34d69e7d"
        alt="eminem"
      />
      <div class="button_container">
        <button id="yesButton" class="button">Yes</button>
        <button id="noButton" class="button">No</button>
      </div>
    </div>

    <div id="background" class="heart_container"></div>

    <script src="script.js"></script>
  </body>
</html>
